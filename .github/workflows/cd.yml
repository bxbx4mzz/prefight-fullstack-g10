name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    # Only run once CI has passed on the same commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # sanity-checks pf-deploy/docker-compose.yml is valid YAML/compose
      # syntax before we build anything from it — adjust the path if it's
      # not directly at the repo root.
      - name: Validate pf-deploy compose file
        run: docker compose -f pf-deploy/docker-compose.yml config

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # assumes a Dockerfile at pf-backend/Dockerfile — matches what was
      # visible in the repo tree earlier.
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./pf-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pf-backend:latest
            ghcr.io/${{ github.repository }}/pf-backend:${{ steps.meta.outputs.sha }}

      # assumes a Dockerfile at pf-frontend/Dockerfile
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./pf-frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pf-frontend:latest
            ghcr.io/${{ github.repository }}/pf-frontend:${{ steps.meta.outputs.sha }}

      # ---------------------------------------------------------------
