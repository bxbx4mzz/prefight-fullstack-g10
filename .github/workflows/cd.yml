name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend
        uses: docker/build-push-action@v6
        with:
          context: ./pf-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prefight-backend:latest

      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./pf-frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prefight-frontend:latest

      - name: Deploy Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            cd ~/prefight-fullstack-g10/pf-deploy
            docker compose pull
            docker compose up -d --remove-orphans