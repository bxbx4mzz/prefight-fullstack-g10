name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pf-backend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pf-backend/pnpm-lock.yaml

      - run: pnpm install
      - run: pnpm run lint --if-present
      - run: pnpm run build --if-present
      - run: pnpm test --if-present

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pf-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pf-frontend/pnpm-lock.yaml

      - run: pnpm install
      - run: pnpm run lint --if-present
      - run: pnpm run build --if-present