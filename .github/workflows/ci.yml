name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/pf-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/pf-frontend

jobs:
  build-and-push:
    # Only run once CI has passed on the same commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # pf-deploy/docker-compose.yml pulls images by name (BACKEND_IMAGE_NAME /
      # FRONTEND_IMAGE_NAME env vars) instead of building — `docker compose
      # config` needs every referenced var defined or it just warns, so we
      # feed it dummy values here purely to validate YAML/compose syntax.
      - name: Validate pf-deploy compose file
        working-directory: ./pf-deploy
        run: |
          cat > .env.ci <<EOT
          PROJECT_NAME=pf-ci
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=postgres
          POSTGRES_APP_USER=app
          POSTGRES_APP_PASSWORD=app
          POSTGRES_PORT=5432
          BACKEND_IMAGE_NAME=${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          FRONTEND_IMAGE_NAME=${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          FRONTEND_PORT=6000
          EOT
          docker compose --env-file .env.ci -f docker-compose.yml config

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # assumes a Dockerfile at pf-backend/Dockerfile (matches repo tree)
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./pf-backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha }}

      # assumes a Dockerfile at pf-frontend/Dockerfile
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./pf-frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha }}

      # ---------------------------------------------------------------
